<div id="container" class="flex min-h-screen flex-col items-center gap-6 bg-slate-100 px-4 py-10">
  <app-city-choice class="w-full max-w-md" (castWeather)="onWeather($event)"></app-city-choice>
  @if (weather(); as w) {
    <app-weather class="w-full max-w-md" [weather]="w"></app-weather>
  }
</div>
